[package]
name = "zerobounce"
version = "1.0.1"
edition = "2021"
description = "Unofficial Rust client for the ZeroBounce email verification API"
readme = "README.md"
homepage = "https://github.com/twisted1919/zerobounce-rust"
repository = "https://github.com/twisted1919/zerobounce-rust"
documentation = "https://docs.rs/zerobounce"
license-file = "LICENSE"
keywords = ["zerbounce", "email-validation"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wiremock = "0.6"
